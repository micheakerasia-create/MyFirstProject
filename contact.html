<!DOCTYPE html>
<html>

<head>

    <!-- Κωδικοποίηση ελληνικών χαρακτήρων -->
    <meta charset="UTF-8">

    <!-- Τίτλος καρτέλας -->
    <title>Τεχνολογία και Υπολογιστές</title>

</head>

<body bgcolor="lightyellow" text="navy">

    <!-- ================================= -->
    <!-- ΜΕΡΟΣ Γ: ΔΗΜΙΟΥΡΓΙΑ ΦΟΡΜΑΣ -->
    <!-- ================================= -->

    <h2>Φόρμα επικοινωνίας</h2>

    <form action="#" method="post">

        <!-- 1. TEXT -->
        Όνομα:

        <input type="text" name="onoma">

        <br><br>


        <!-- 2. EMAIL -->
        Email:

        <input type="email" name="email">

        <br><br>


        <!-- 3. NUMBER -->
        Ηλικία:

        <input type="number" name="ilikia">

        <br><br>


        <!-- 4. DATE -->
        Ημερομηνία:

        <input type="date" name="imerominia">

        <br><br>


        <!-- 5. PASSWORD -->
        Κωδικός:

        <input type="password" name="kodikos">

        <br><br>


        <!-- 6. RADIO -->
        Φύλο:

        <input type="radio" name="fylo" value="andras">
        Άνδρας

        <input type="radio" name="fylo" value="gynaika">
        Γυναίκα

        <br><br>


        <!-- 7. CHECKBOX -->
        Ενδιαφέροντα:

        <br>

        <input type="checkbox" name="html" value="html">
        HTML

        <br>

        <input type="checkbox" name="python" value="python">
        Python

        <br>

        <input type="checkbox" name="java" value="java">
        Java

        <br><br>


        <!-- 8. SELECT -->
        Επιλέξτε γλώσσα προγραμματισμού:

        <select name="glossa">

            <option value="python">
                Python
            </option>

            <option value="java">
                Java
            </option>

            <option value="cpp">
                C++
            </option>

            <option value="html">
                HTML
            </option>

        </select>

        <br><br>


        <!-- 9. TEXTAREA -->
        Μήνυμα:

        <br>

        <textarea name="minyma" rows="5" cols="40"></textarea>

        <br><br>


        <!-- 10. SUBMIT -->
        <input type="submit" value="Αποστολή">


        <!-- 11. RESET -->
        <input type="reset" value="Καθαρισμός">

    </form>

    <hr>


    <!-- ================================= -->
    <!-- ΜΕΡΟΣ Δ: ΥΠΟΣΕΛΙΔΟ ΚΑΙ ΟΡΓΑΝΩΣΗ -->
    <!-- ================================= -->

    <footer>

        <p>
            &copy; 2026 Τεχνολογία και Υπολογιστές
        </p>

        <p>
            Δημιουργία εκπαιδευτικής ιστοσελίδας
        </p>

    </footer>

    <!-- Τέλος ιστοσελίδας -->

</body>

</html>
